name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check, test (Python ${{ matrix.python-version }}, SQLite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Tests with coverage
        run: uv run pytest --cov

  postgres:
    name: Test against PostgreSQL 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ledgerline
          POSTGRES_PASSWORD: ledgerline
          POSTGRES_DB: ledgerline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerline -d ledgerline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ledgerline:ledgerline@localhost:5432/ledgerline_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Install dependencies
        run: uv sync --locked
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Reconcile the empty ledger
        run: uv run ledgerline reconcile
      - name: Tests
        run: uv run pytest

  docker:
    name: Build the image and smoke-test it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Build image
        run: docker build --tag ledgerline:ci .
      - name: Start container
        run: >-
          docker run --detach --name ledgerline --publish 8000:8000
          --env LEDGERLINE_API_KEYS=ci-smoke-key
          ledgerline:ci
          sh -c "alembic upgrade head && exec ledgerline serve --host 0.0.0.0 --port 8000"
      - name: Wait for the container HEALTHCHECK
        run: |
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' ledgerline)"
            echo "health: ${status}"
            if [ "${status}" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Smoke-test the API
        run: |
          curl --fail --silent --show-error http://localhost:8000/healthz
          curl --fail --silent --show-error http://localhost:8000/readyz
          curl --fail --silent --show-error http://localhost:8000/v1/accounts \
            -H "Authorization: Bearer ci-smoke-key" \
            -H "Content-Type: application/json" \
            -d '{"name": "Smoke test", "type": "asset", "currency": "USD"}'
      - name: Container logs
        if: always()
        run: docker logs ledgerline

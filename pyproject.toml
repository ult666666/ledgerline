[project]
name = "ledgerline"
version = "0.1.0"
description = "A double-entry ledger service: balanced, immutable journal entries, idempotent writes and race-free balance checks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Charles Dai" }]
requires-python = ">=3.12"
keywords = ["ledger", "double-entry", "accounting", "fintech", "idempotency", "fastapi", "sqlalchemy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.3.6",
]

[project.urls]
Homepage = "https://github.com/ult666666/ledgerline"
Repository = "https://github.com/ult666666/ledgerline"
Documentation = "https://github.com/ult666666/ledgerline/blob/main/docs/DESIGN.md"
Issues = "https://github.com/ult666666/ledgerline/issues"
Changelog = "https://github.com/ult666666/ledgerline/blob/main/CHANGELOG.md"

[project.scripts]
ledgerline = "ledgerline.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.8",
    "mypy>=2.4.0",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "RUF",   # ruff-specific rules
    "N",     # pep8-naming
    "S",     # flake8-bandit (security)
    "DTZ",   # flake8-datetimez: no naive datetimes in a ledger
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "PIE",   # flake8-pie
    "PTH",   # prefer pathlib
    "TID",   # flake8-tidy-imports
]
ignore = [
    "N818",  # domain errors are named for the condition (InsufficientFunds), not "...Error"
]

[tool.ruff.lint.per-file-ignores]
# Tests use bare asserts and obviously fake credentials.
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["ledgerline"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
